[buildPlans.IosevkaOrzoNL]
  family = "Iosevka Orzo NL"
  spacing = "fontconfig-mono"
  serifs = "sans"
  noCvSs = true
  exportGlyphNames = true
  buildTextureFeature = true
  noLigation = true

[buildPlans.IosevkaOrzoNL.variants.design]
  apl-form = "enable" # custom

  zero = "tall-slashed"
  i = "serifed-asymmetric"
  lower-lambda = "tailed-turn"
  lower-xi = "rounded"
  lower-chi = "semi-chancery-straight-serifless"
  cyrl-em = "hanging-serifless"
  asterisk = "penta-mid"
  brace = "straight"
  guillemet = "straight"
  number-sign = "slanted"
  ampersand = "upper-open"
  percent = "rings-continuous-slash"
  bar = "force-upright"
  lig-equal-chain = "without-notch"
  lig-hyphen-chain = "without-notch"


[buildPlans.IosevkaOrzoNL.weights.Regular]
  shape = 400
  menu = 400
  css = 400

[buildPlans.IosevkaOrzoNL.weights.Bold]
  shape = 700
  menu = 700
  css = 700


[buildPlans.IosevkaOrzoNL.widths.Normal]
  shape = 548 # from "semi-expanded"
  menu = 5
  css = "normal"


[buildPlans.IosevkaOrzoNL.slopes.Upright]
  angle = 0
  shape = "upright"
  menu = "upright"
  css = "normal"

[buildPlans.IosevkaOrzoNL.slopes.Italic]
  angle = 9.4
  shape = "italic"
  menu = "italic"
  css = "italic"


[buildPlans.IosevkaOrzo]
  family = "Iosevka Orzo"
  spacing = "fontconfig-mono"
  serifs = "sans"
  noCvSs = true
  exportGlyphNames = true
  buildTextureFeature = true
  noLigation = false

  variants.inherits = "buildPlans.IosevkaOrzoNL"
  weights.inherits  = "buildPlans.IosevkaOrzoNL"
  widths.inherits   = "buildPlans.IosevkaOrzoNL"
  slopes.inherits   = "buildPlans.IosevkaOrzoNL"

[buildPlans.IosevkaOrzo.ligations]
  enables = [
    # Arrows
    "arrow-hyphen",         # <->
    "counter-arrow-hyphen", # >-<, ->-

    # Comparison
    "lteq",   # <= as lte
    "gteq",   # >= as gte
    "eqeq",   # == and ===
    "exeq",   # != and !==

    # Distance/position arrangement
    "kern-dotty",     # ::, ::: and ...
    "kern-bars",      # ||, ||| and //
    "slash-asterisk", # /* and */ (shift asterisk)
    "llgg",           # <<, >> and other angle-bracket chaining

    # Centering
	  "center-op-trigger-equal-l", # :=, *=, .= *=* <*>

    # Connection (---, +++, __, ##)
    "minus-minus-minus",
    "plus-plus-plus",
    "underscore-underscore",
    "hash-hash",

    # Other
    "html-comment",       # <!--
    "markdown-checkboxes" # - [ ], - [x] and - [X]
  ]
