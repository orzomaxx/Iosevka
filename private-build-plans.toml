[buildPlans.IosevkaOrzoNL]
  family = "Iosevka Orzo NL"
  spacing = "fontconfig-mono"
  serifs = "sans"
  noCvSs = false
  exportGlyphNames = true
  buildTextureFeature = true
  noLigation = true

[buildPlans.IosevkaOrzoNL.variants.design]
  apl-form = "enable" # custom

  zero = "tall-slashed"
  i = "serifed-asymmetric"
  lower-lambda = "tailed-turn"
  lower-xi = "rounded"
  lower-chi = "semi-chancery-straight-serifless"
  cyrl-em = "hanging-serifless"
  asterisk = "penta-mid"
  brace = "straight"
  guillemet = "straight"
  ampersand = "upper-open"
  percent = "rings-continuous-slash"
  lig-equal-chain = "without-notch"
  lig-hyphen-chain = "without-notch"


[buildPlans.IosevkaOrzoNL.widths.Normal]
  shape = 548 # from "semi-expanded"
  menu = 5
  css = "normal"

[buildPlans.IosevkaOrzoNL.slopes.Upright]
  angle = 0
  shape = "upright"
  menu = "upright"
  css = "normal"

[buildPlans.IosevkaOrzoNL.slopes.Italic]
  angle = 9.4
  shape = "italic"
  menu = "italic"
  css = "italic"


[buildPlans.IosevkaOrzo]
  family = "Iosevka Orzo"
  spacing = "fontconfig-mono"
  serifs = "sans"
  noCvSs = false
  exportGlyphNames = true
  buildTextureFeature = true
  noLigation = false

variants.inherits = "buildPlans.IosevkaOrzoNL"
weights.inherits  = "buildPlans.IosevkaOrzoNL"
widths.inherits   = "buildPlans.IosevkaOrzoNL"
slopes.inherits   = "buildPlans.IosevkaOrzoNL"

[buildPlans.IosevkaOrzo.ligations]
  # inherits = "default-calt"

  enables = [ # => <== ~> <~ <~>
  # "arrow-l",         # <- <--
  # "arrow-r",         # -> --> ----->
  # "arrow-lr",        # <-> <-->
  # "counter-arrow-l", # -< --<
  # "counter-arrow-r", # >- >--
    "arrow-hyphen",         # Arrows using hyphen-minus (-) as the rod.
    "counter-arrow-hyphen", # Counter-arrows using hyphen-minus (-) as the rod.

    "eqeq",   # == and ===
    "lteq",   # <= as lte
    "gteq",   # >= as gte
    "lteq-separate", # Display <= as separate shape.
    "gteq-separate", # Display >= as separate shape.
    "exeq",   # != and !==

    "slash-asterisk", # Shift asterisk in /* and */
  # "kern-dotty", # Move connecting dotty punctuations closer, like for ::, ::: and ....
  # "kern-bars", # Move consecutive bars closer, like for ||, ||| and //.

  # "tilde-tilde",                      # merge ~~
  # "tilde-tilde-tilde",                # merge ~~~
    "minus-minus",                      # merge --
    "minus-minus-minus",                # merge ---
    "plus-plus",                        # merge ++
    "plus-plus-plus",                   # merge ++
    "underscore-underscore",            # merge __
    "underscore-underscore-underscore", # merge ___
    "hash-hash",                        # merge ##
    "hash-hash-hash",                   # merge ###

    "llgg", # Enable ligation for <<, >> and other angle-bracket chaining.
  # "llggeq", # Enable ligation for <<=, >>= as shift operator.
    "html-comment", # <!--
    "markdown-checkboxes" # - [ ] and - [x]
  ]
